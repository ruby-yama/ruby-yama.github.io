<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>お仕事のご依頼｜rubygames</title>
<meta name="description" content="rubygames（ruby-yama）へのお仕事のご依頼・ご相談はこちらから。">
<link rel="canonical" href="https://rubygames.net/request/">
<meta property="og:image" content="https://rubygames.net/img/og.jpg">
<link rel="icon" href="../img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#07090f;--card:#0f1420;--line:rgba(255,255,255,.1);--tx:#e8ecf3;--mut:#8b96a8;--or:#ff7a1a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Zen Kaku Gothic New',system-ui,sans-serif;line-height:1.7;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
header{border-bottom:1px solid var(--line)}
header .w{display:flex;align-items:center;justify-content:space-between;height:60px}
.w{max-width:720px;margin:0 auto;padding:0 20px}
.brand{display:flex;align-items:center;gap:10px;font:700 18px Inter;letter-spacing:.04em}
.brand img{width:30px;height:30px;border-radius:8px}
.brand i{color:var(--or);font-style:normal;margin-left:-.3em}
.back{font:500 13px Inter;letter-spacing:.12em;color:var(--mut)}
.eyebrow{font:500 12px Inter;letter-spacing:.42em;color:var(--or);margin-top:56px}
h1{margin:12px 0 8px;font-size:28px}
.lead{color:var(--mut);margin:0 0 32px}
form{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px 22px;margin-bottom:60px}
label{display:block;font-size:14px;margin:0 0 6px}
label b{color:var(--or);font-size:12px;margin-left:6px;font-weight:400}
.f{margin-bottom:20px}
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--tx);background:#070a12;border:1px solid var(--line);border-radius:10px;padding:11px 12px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--or)}
textarea{min-height:180px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.note{color:var(--mut);font-size:12px;margin:4px 0 18px}
button{width:100%;height:50px;border:0;border-radius:999px;background:#fff;color:#07090f;font:700 15px 'Zen Kaku Gothic New';cursor:pointer}
button:disabled{opacity:.5}
.msg{margin-top:14px;font-size:14px;min-height:1.5em}
.msg.err{color:#ff8a8a}
.done{text-align:center;padding:30px 0}
.done h2{font-size:20px;margin:0 0 10px}
@media (max-width:560px){.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="w">
  <a class="brand" href="../"><img src="../img/logo.png" alt="">ruby<i>games</i></a>
  <a class="back" href="../">← TOP</a>
</div></header>
<div class="w">
  <div class="eyebrow">WORK REQUEST</div>
  <h1>お仕事のご依頼</h1>
  <p class="lead">ゲーム開発・キャラクターやイラスト・動画・グッズやコラボなどのご相談を受け付けています。内容を確認して、メールでお返事します。</p>
  <form id="f" novalidate>
    <div class="row">
      <div class="f"><label for="name">お名前<b>必須</b></label><input id="name" maxlength="60" autocomplete="name"></div>
      <div class="f"><label for="org">会社・団体名</label><input id="org" maxlength="80" autocomplete="organization"></div>
    </div>
    <div class="f"><label for="email">メールアドレス<b>必須</b></label><input id="email" type="email" maxlength="120" autocomplete="email"></div>
    <div class="row">
      <div class="f"><label for="kind">ご依頼の種類<b>必須</b></label><select id="kind">
        <option>ゲーム開発（受託）</option><option>イラスト・キャラクター</option><option>動画制作</option><option>グッズ・コラボ</option><option>取材・掲載</option><option>その他</option></select></div>
      <div class="f"><label for="budget">ご予算</label><select id="budget">
        <option>未定・相談したい</option><option>〜10万円</option><option>10〜30万円</option><option>30〜100万円</option><option>100万円〜</option></select></div>
    </div>
    <div class="f"><label for="due">ご希望の時期</label><input id="due" maxlength="60" placeholder="例：2027年3月ごろ"></div>
    <div class="f"><label for="body">ご依頼の内容<b>必須</b></label><textarea id="body" maxlength="4000" placeholder="作りたいもの・目的・参考になるもの など"></textarea></div>
    <input class="hp" id="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
    <p class="note">お送りいただいた内容は、お返事とご相談のためだけに使います。</p>
    <button id="go" type="submit">送信する</button>
    <div class="msg" id="msg"></div>
  </form>
</div>
<script>
const API='https://rubygames-contact.ruby-yama.workers.dev/v1/req';
const $=id=>document.getElementById(id);
$('f').addEventListener('submit',async e=>{e.preventDefault();const m=$('msg');m.className='msg';
 const d={name:$('name').value.trim(),org:$('org').value.trim(),email:$('email').value.trim(),kind:$('kind').value,budget:$('budget').value,due:$('due').value.trim(),body:$('body').value.trim(),hp:$('hp').value};
 if(!d.name){m.className='msg err';m.textContent='お名前を入れてください。';return}
 if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email)){m.className='msg err';m.textContent='メールアドレスを確かめてください。';return}
 if(d.body.length<10){m.className='msg err';m.textContent='ご依頼の内容をもう少しくわしく書いてください。';return}
 $('go').disabled=true;m.textContent='送信しています…';
 try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});const j=await r.json();
  if(j.ok){$('f').innerHTML='<div class="done"><h2>送信しました</h2><p>ありがとうございます。内容を確認して、メールでお返事します。</p><p><a href="../" style="color:#ff7a1a">トップへ戻る</a></p></div>';return}
  m.className='msg err';m.textContent=j.err==='many'?'送信が多すぎます。時間をおいてお試しください。':'送信できませんでした。入力を確かめてください。';
 }catch(err){m.className='msg err';m.textContent='送信できませんでした。通信を確かめてください。'}
 $('go').disabled=false;});
</script>
</body>
</html>
